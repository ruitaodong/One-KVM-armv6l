name: Build ARMv6 (Pi Zero / Zero W)

# Runs scripts/build-armv6.sh, which compiles One-KVM natively inside a
# Raspberry Pi OS armhf (linux/arm/v6) container, pushes that build
# environment (dev) image to GHCR as ghcr.io/<owner>/one-kvm-armv6-dev:<suite>,
# and attaches the .deb packages to a GitHub Release.
#
# GitHub's ubuntu-24.04-arm runners have no 32-bit ARM mode, so there the
# container runs under QEMU (slow: the first build can take several hours).
# Caches are saved even when the build step times out, so re-running the
# workflow continues where it stopped. A self-hosted Oracle Cloud Ampere A1
# runner runs it natively and much faster.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      suite:
        description: Raspberry Pi OS release on the Pi (must match)
        type: choice
        options: [trixie, bookworm, both]
        default: trixie
      runner:
        description: "ubuntu-24.04-arm (GitHub, QEMU) or self-hosted (e.g. an OCI Ampere A1 VM)"
        type: choice
        options: [ubuntu-24.04-arm, self-hosted]
        default: ubuntu-24.04-arm
      release_tag:
        description: "Publish the .deb to this release tag (created if missing); empty = artifact only"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: armv6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.m.outputs.suites }}
    steps:
      - id: m
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "${SUITE:-both}" in
            both) echo 'suites=["trixie","bookworm"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo "suites=[\"${SUITE}\"]" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: setup
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.setup.outputs.suites) }}
    permissions:
      contents: read
      packages: write
    env:
      SUITE: ${{ matrix.suite }}
      IMAGE: onekvm-armv6:${{ matrix.suite }}
      CACHE: ${{ github.workspace }}/../armv6-cache/${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v4

      - name: Set GHCR dev image name
        run: |
          DEV_IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/one-kvm-armv6-dev"
          echo "DEV_IMAGE=${DEV_IMAGE}" >> "$GITHUB_ENV"
          # Layers are reused from the last pushed image (an absent one is skipped)
          echo "CACHE_FROM=${DEV_IMAGE}:${SUITE}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for native 32-bit ARM, else enable QEMU
        id: arch
        run: |
          r=$(docker run --rm --platform linux/arm/v7 debian:trixie linux32 uname -m 2>&1 || true)
          echo "32-bit ARM test: $r"
          if [ "$r" = armv8l ]; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This runner can't run 32-bit ARM natively; building under QEMU (slow)."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm)
        if: steps.arch.outputs.native != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Verify the linux/arm/v6 platform runs
        run: docker run --rm --platform linux/arm/v6 tianon/raspbian:${SUITE}-slim uname -m

      # Build environment (dev) image: gcc, Rust, libjpeg-turbo 3, libyuv.
      # Slow to build under QEMU, so it reuses the layers of the image last
      # pushed to GHCR (CACHE_FROM) and is pushed again right away, before
      # the long compile.
      - name: Build environment (dev) image
        run: ./scripts/build-armv6.sh image

      - name: Push dev image to GHCR
        env:
          # the release this run publishes to, if any
          TAG_NAME: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
        run: |
          tags=("${DEV_IMAGE}:${SUITE}" "${DEV_IMAGE}:${SUITE}-${GITHUB_SHA::7}")
          if [ -n "${TAG_NAME}" ]; then
            tags+=("${DEV_IMAGE}:${SUITE}-$(printf '%s' "${TAG_NAME}" | tr -c 'A-Za-z0-9_.-' '-')")
          fi
          for t in "${tags[@]}"; do
            docker tag "${IMAGE}" "$t"
            docker push "$t"
          done
          echo "### Dev image" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- `%s`\n' "${tags[@]}" >> "$GITHUB_STEP_SUMMARY"

      # Cargo registry/git + target dir. A new key every run so a run that
      # timed out still saves its progress for the next one.
      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE }}
          key: armv6-cargo-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            armv6-cargo-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-
            armv6-cargo-${{ matrix.suite }}-

      # Downloading and unpacking crates natively is much faster than under
      # QEMU; the registry layout doesn't depend on the architecture.
      - name: Prefetch crates on the host
        run: |
          mkdir -p "${CACHE}/registry" "${CACHE}/git" "${CACHE}/target"
          if command -v cargo >/dev/null; then
            CARGO_HOME="${CACHE}" cargo fetch --locked --target arm-unknown-linux-gnueabihf
          else
            echo "No host cargo; crates are fetched inside the container."
          fi

      - name: Build and package (scripts/build-armv6.sh)
        timeout-minutes: 320
        run: ./scripts/build-armv6.sh build

      - name: Save Cargo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE }}
          key: armv6-cargo-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checksums
        run: |
          cd dist
          ls -la
          sha256sum *.deb "one-kvm-armv6-${SUITE}" > "SHA256SUMS-armv6-${SUITE}"
          cat "SHA256SUMS-armv6-${SUITE}"

      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-armv6-${{ matrix.suite }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: one-kvm-armv6-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### One-KVM for Raspberry Pi Zero / Zero W / Pi 1 (ARMv6)

            Pick the package that matches the Pi's Raspberry Pi OS release
            (`grep VERSION_CODENAME /etc/os-release`): `-armv6-trixie` (13) or
            `-armv6-bookworm` (12).

            ```sh
            sudo apt update
            sudo apt install ./one-kvm_*_armhf-armv6-trixie.deb
            ```

            Build environment (dev) image, `linux/arm/v6`:
            `ghcr.io/${{ github.repository_owner }}/one-kvm-armv6-dev:<suite>-${{ inputs.release_tag || github.ref_name }}`
          files: |
            dist/*.deb
            dist/one-kvm-armv6-*
            dist/SHA256SUMS-armv6-*
