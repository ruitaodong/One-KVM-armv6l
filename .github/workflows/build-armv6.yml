name: Build ARMv6 (Pi Zero / Zero W)

# Runs scripts/build-armv6.sh, which compiles One-KVM natively inside a
# Raspberry Pi OS trixie armhf (linux/arm/v6) container, pushes that build
# environment (dev) image to GHCR as ghcr.io/<owner>/one-kvm-armv6-dev, and
# attaches the .deb to a GitHub Release.
#
# GitHub's ubuntu-24.04-arm runners (Azure Cobalt 100, Neoverse N2) run
# 32-bit ARM code natively, so no QEMU is needed. On a runner that can't,
# the job fails fast unless allow_qemu is set (a build under QEMU takes many
# hours). The Cargo cache is saved even when the build step times out, so
# re-running the workflow continues where it stopped.
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      runner:
        description: "ubuntu-24.04-arm (GitHub) or self-hosted (e.g. an OCI Ampere A1 VM)"
        type: choice
        options: [ubuntu-24.04-arm, self-hosted]
        default: ubuntu-24.04-arm
      release_tag:
        description: "Publish the .deb to this release tag (created if missing); empty = artifact only"
        type: string
        default: ""
      allow_qemu:
        description: "If the runner can't run 32-bit ARM natively, build under QEMU (many hours) instead of failing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: armv6-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    permissions:
      contents: write   # GitHub Release
      packages: write   # GHCR dev image
    env:
      IMAGE: onekvm-armv6:latest
      # the release this run publishes to, if any
      TAG_NAME: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name and cache dir
        run: |
          # Cargo cache outside the checkout (actions/cache rejects "..")
          echo "CACHE=${RUNNER_TEMP}/armv6-cache" >> "$GITHUB_ENV"
          DEV_IMAGE="ghcr.io/$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')/one-kvm-armv6-dev"
          echo "DEV_IMAGE=${DEV_IMAGE}" >> "$GITHUB_ENV"
          # layers are reused from the last pushed image (skipped if there is none)
          echo "CACHE_FROM=${DEV_IMAGE}:latest" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Native check without guessing from uname -m (which reports aarch64,
      # armv8l or armv7l depending on Docker's personality handling and the
      # QEMU version): first make sure no QEMU handler for 32-bit ARM is
      # registered, then run the build's base image. If it runs, nothing but
      # the CPU can have run it. QEMU is opt-in (allow_qemu): a build under
      # emulation takes many hours, so by default this fails fast instead.
      - name: Check for native 32-bit ARM
        id: arch
        env:
          BASE: tianon/raspbian:trixie-slim
          ALLOW_QEMU: ${{ inputs.allow_qemu || false }}
        run: |
          lscpu | grep -i 'op-mode' || true
          for f in /proc/sys/fs/binfmt_misc/qemu-arm /proc/sys/fs/binfmt_misc/qemu-armeb; do
            if [ -e "$f" ] && grep -qx enabled "$f"; then
              echo "Disabling ${f##*/} binfmt handler"
              echo 0 | sudo -n tee "$f" >/dev/null || true
            fi
          done
          if grep -qsx enabled /proc/sys/fs/binfmt_misc/qemu-arm; then
            echo "::error::A qemu-arm binfmt handler is registered and couldn't be disabled; can't tell native from emulated."
            exit 1
          fi
          docker pull -q --platform linux/arm/v6 "$BASE" >/dev/null
          if docker run --rm --platform linux/arm/v6 "$BASE" true; then
            echo "32-bit ARM runs natively (no emulator registered)."
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif [ "${ALLOW_QEMU}" = true ]; then
            echo "::warning::This runner can't run 32-bit ARM natively; building under QEMU (many hours)."
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::This runner can't run 32-bit ARM natively. Use a runner that can (ubuntu-24.04-arm, an OCI Ampere A1) or run the workflow with allow_qemu."
            exit 1
          fi

      # ARMv6 has no DMB/DSB/ISB; its code issues memory barriers as CP15
      # writes, which ARMv8 kernels trap and emulate by default
      # (abi.cp15_barrier=1). Every atomic in rustc, LLVM and cargo then
      # costs a kernel round trip, slowing a native build several-fold.
      # 2 = the CPU executes them itself. Kernel-wide, harmless.
      - name: Let the CPU execute ARMv6 barriers (abi.cp15_barrier=2)
        if: steps.arch.outputs.native == 'true'
        run: |
          for k in cp15_barrier setend; do
            f=/proc/sys/abi/$k
            [ -e "$f" ] || continue
            echo "abi.$k was $(cat "$f")"
            echo 2 | sudo -n tee "$f" >/dev/null \
              || echo "::warning::Could not set abi.$k=2; ARMv6 code will run much slower"
            echo "abi.$k is $(cat "$f")"
          done

      - name: Set up QEMU (arm)
        if: steps.arch.outputs.native != 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      # Build environment (dev) image. Pushed right away, before the long
      # compile, so it is published (and cached for the next run) even if
      # the compile times out.
      - name: Build environment (dev) image
        run: ./scripts/build-armv6.sh image

      - name: Push dev image to GHCR
        run: |
          tags=("${DEV_IMAGE}:latest" "${DEV_IMAGE}:${GITHUB_SHA::7}")
          if [ -n "${TAG_NAME}" ]; then
            tags+=("${DEV_IMAGE}:$(printf '%s' "${TAG_NAME}" | tr -c 'A-Za-z0-9_.-' '-')")
          fi
          for t in "${tags[@]}"; do
            docker tag "${IMAGE}" "$t"
            docker push "$t"
          done
          { echo "### Dev image"; printf -- '- `%s`\n' "${tags[@]}"; } >> "$GITHUB_STEP_SUMMARY"

      # Cargo registry/git + target dir. A new key every run, so a run that
      # timed out still saves its progress for the next one.
      - name: Restore Cargo cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CACHE }}
          key: armv6-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            armv6-cargo-${{ hashFiles('Cargo.lock') }}-
            armv6-cargo-

      # Fetch crates with the host's cargo (fast, and much faster than under
      # QEMU); the registry layout doesn't depend on the architecture.
      - name: Prefetch crates on the host
        run: |
          mkdir -p "${CACHE}/registry" "${CACHE}/git" "${CACHE}/target"
          if command -v cargo >/dev/null; then
            CARGO_HOME="${CACHE}" cargo fetch --locked --target arm-unknown-linux-gnueabihf
          else
            echo "No host cargo; crates are fetched inside the container."
          fi

      - name: Build and package (scripts/build-armv6.sh)
        timeout-minutes: 320
        run: ./scripts/build-armv6.sh build

      - name: Save Cargo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CACHE }}
          key: armv6-cargo-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.deb one-kvm-armv6 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: one-kvm-armv6
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.TAG_NAME != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ### One-KVM for Raspberry Pi Zero / Zero W / Pi 1 (ARMv6)

            For Raspberry Pi OS 13 (trixie). H.264 is encoded by the Pi's
            hardware encoder (bcm2835-codec); CSI capture (e.g. TC358743, UYVY)
            goes to it without color conversion.

            ```sh
            sudo apt update
            sudo apt install ./one-kvm_*_armhf-armv6.deb
            ```

            Build environment image (`linux/arm/v6`): `${{ env.DEV_IMAGE }}:${{ env.TAG_NAME }}`
          files: |
            dist/*.deb
            dist/one-kvm-armv6
            dist/SHA256SUMS
